# Canonical ruff CI check — copy to <repo>/.github/workflows/lint.yml for Python repos
# that don't already run ruff inside an existing ci.yml. Checks only; never rewrites the
# branch (formatting is fixed locally via pre-commit). Mirrors tommybot's ruff steps.
# Ruff is PINNED here, in lockstep with the rev in .pre-commit-config.yaml. An
# unpinned `uvx ruff` resolves the newest release at run time, so a broadened
# default rule set silently turns the repo red on code that never changed —
# exactly what happened once B008/S110/BLE001/EXE001/I001/UP017 + RUF100 became
# defaults. Bump this and the pre-commit rev together, never one alone.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff@0.12.0 check --output-format=github .
      - name: Ruff format check
        run: uvx ruff@0.12.0 format --check .
